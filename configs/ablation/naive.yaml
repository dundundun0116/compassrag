# 消融第 0 级：naive —— scripted 单轮固定检索（混合检索路由就绪后自动并入）+ 直接生成
# 注：deepseek-v4.1-flash 带思维链（实测 completion_tokens=推理+答案）。预算 512 时约 27% 的题
# 推理链吃光预算出空答案（2026-10-10 诊断，runs/diag/）；故首轮 1024，空答案带提示重试 2048。
agent:
  top_k: 10
  max_rounds: 1
  use_rewrite: false
  use_wiki: false
  use_decision: false
  answer_max_tokens: 1024
  answer_retry_max_tokens: 2048
